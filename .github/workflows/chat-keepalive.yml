name: Keep the assistant awake
# Free Hugging Face Spaces go to sleep when unused. This pings the backend named in content/site.json; it does nothing while that is empty.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the backend
        run: |
          URL=$(node -e "const e=(require('./content/site.json').chat||{}).endpoint||'';try{process.stdout.write(new URL(e).origin+'/health')}catch{}")
          if [ -z "$URL" ]; then echo "chat.endpoint is empty, nothing to ping"; exit 0; fi
          curl --fail --silent --show-error --max-time 120 "$URL"
