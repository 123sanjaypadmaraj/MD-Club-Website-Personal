name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check scripts
        run: node --check assets/site.js && node --check admin/admin.js && node --check scripts/check-content.mjs && node --check scripts/smoke.mjs && node --check scripts/check-content.test.mjs
      - name: Run tests
        run: node --test scripts/*.test.mjs
      - name: Validate content
        run: node scripts/check-content.mjs
      - name: Stage public files
        run: |
          mkdir _site
          cp *.html favicon.svg robots.txt sitemap.xml manifest.webmanifest _site/
          cp -r assets content photos admin _site/
      - name: Smoke test pages
        run: SMOKE_ROOT=_site node scripts/smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
